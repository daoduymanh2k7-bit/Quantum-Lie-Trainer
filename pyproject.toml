# Cau hinh test + lint. Khong dung build system (chay truc tiep tu source),
# giong pattern cua du an tham khao LAWGIC — day la demo, khong publish package.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data"]
